<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pegawai</title>

    <style>
        h2 {
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h2>Data Pegawai</h2>

    <table>
        <!-- Judul kolom -->
        <thead>
            <tr>
                <th>Nama Pegawai</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
            </tr>
        </thead>

        <!-- Isi data -->
        <tbody id="dataPegawai">
        </tbody>

        <!-- Total gaji -->
        <tfoot>
            <tr>
                <th colspan="4">Total Gaji</th>
                <th colspan="4" id="totalGaji"></th>
            </tr>
        </tfoot>
    </table>

    <script>
        // Data pegawai
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        // Menentukan gaji pokok menggunakan if
        let gajiPokok;

        if (jabatan == "Manajer") {
            gajiPokok = 15000000;
        } else if (jabatan == "Asisten Manajer") {
            gajiPokok = 10000000;
        } else if (jabatan == "Staff") {
            gajiPokok = 5000000;
        }

        // Tunjangan jabatan = 15% dari gaji pokok
        let tunjanganJabatan = gajiPokok * 15 / 100;

        // BPJS = 10% dari gaji pokok
        let bpjs = gajiPokok * 10 / 100;

        // Tunjangan keluarga menggunakan ternary
        let tunjanganKeluarga = status == "Menikah"
            ? gajiPokok * 20 / 100
            : 0;

        // Total gaji
        let totalGaji = gajiPokok + tunjanganJabatan + bpjs + tunjanganKeluarga;

        // Menampilkan data ke tbody
        document.getElementById("dataPegawai").innerHTML = `
            <tr>
                <td>${nama}</td>
                <td>${umur} tahun</td>
                <td>${jabatan}</td>
                <td>${status}</td>
                <td>Rp ${gajiPokok.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganJabatan.toLocaleString("id-ID")}</td>
                <td>Rp ${bpjs.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganKeluarga.toLocaleString("id-ID")}</td>
            </tr>
        `;

        // Menampilkan total gaji ke tfoot
        document.getElementById("totalGaji").innerHTML =
            "Rp " + totalGaji.toLocaleString("id-ID");
    </script>

</body>
</html>

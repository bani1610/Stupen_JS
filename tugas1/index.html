<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Geometri</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #eeeeee;
            color: #333333;
            font-family: Arial, sans-serif;
        }

        .shell {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        .eyebrow {
            color: #666666;
            font-size: 13px;
        }

        h1 {
            margin: 8px 0;
            font-size: 30px;
        }

        .stamp {
            display: none;
        }

        main {
            display: flex;
            gap: 20px;
        }

        .panel {
            flex: 1;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background-color: white;
        }

        .panel-title {
            margin-top: 0;
            font-size: 20px;
        }

        .shape-picker {
            margin-bottom: 20px;
        }

        .shape-button {
            width: 48%;
            min-height: 45px;
            margin-bottom: 8px;
            padding: 8px;
            border: 1px solid #bbbbbb;
            border-radius: 3px;
            background-color: #f8f8f8;
            color: #333333;
            cursor: pointer;
            text-align: left;
        }

        .shape-button:hover,
        .shape-button.active {
            background-color: #dddddd;
        }

        .shape-icon {
            margin-right: 5px;
            font-size: 17px;
        }

        .shape-name {
            font-size: 13px;
        }

        .fields {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin-top: 5px;
            padding: 9px;
            border: 1px solid #aaaaaa;
            border-radius: 3px;
            font-size: 16px;
        }

        .unit {
            display: block;
            color: #777777;
            font-size: 12px;
            font-weight: normal;
        }

        .calculate {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: 1px solid #555555;
            border-radius: 3px;
            background-color: #555555;
            color: white;
            cursor: pointer;
        }

        .calculate:hover {
            background-color: #333333;
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 10px;
        }

        .result-head h2 {
            margin: 0;
            font-size: 20px;
        }

        .result-head span {
            color: #777777;
            font-size: 12px;
        }

        .visual {
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .visual-shape {
            border: 3px solid #777777;
        }

        .visual-square {
            width: 75px;
            height: 75px;
        }

        .visual-rectangle {
            width: 135px;
            height: 65px;
        }

        .visual-triangle {
            width: 0;
            height: 0;
            border-right: 45px solid transparent;
            border-bottom: 75px solid #777777;
            border-left: 45px solid transparent;
        }

        .visual-box {
            width: 95px;
            height: 68px;
        }

        .metrics {
            display: flex;
            gap: 10px;
        }

        .metric {
            flex: 1;
            padding: 12px;
            border: 1px solid #dddddd;
            background-color: #f7f7f7;
        }

        .metric small {
            display: block;
            margin-bottom: 7px;
            color: #666666;
            font-size: 11px;
        }

        .metric strong {
            color: #333333;
            font-size: 20px;
        }

        .formula {
            margin-top: 18px;
            color: #555555;
            font-size: 13px;
        }

        .hint {
            color: #777777;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            main {
                display: block;
            }

            .panel {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <div><div class="eyebrow">01 / parameter bebas</div><h1>Ruang<br>Ukur.</h1></div>
            <div class="stamp">GEOMETRY<br>LAB_2026</div>
        </header>
        <main>
            <section class="panel controls">
                <h2 class="panel-title">Pilih objek yang mau diukur</h2>
                <div class="shape-picker" id="shapePicker">
                    <button class="shape-button active" data-shape="persegi"><span class="shape-icon">□</span><span class="shape-name">Persegi</span></button>
                    <button class="shape-button" data-shape="persegiPanjang"><span class="shape-icon">▭</span><span class="shape-name">Persegi panjang</span></button>
                    <button class="shape-button" data-shape="segitiga"><span class="shape-icon">△</span><span class="shape-name">Segitiga</span></button>
                    <button class="shape-button" data-shape="balok"><span class="shape-icon">◇</span><span class="shape-name">Balok</span></button>
                </div>
                <div class="fields" id="fields"></div>
                <button class="calculate" id="calculateButton">Hitung ukuran →</button>
                <p class="hint">* Isi angka positif. Satuan mengikuti input kamu.</p>
            </section>
            <section class="panel result">
                <div class="result-head"><h2 id="resultTitle">Persegi</h2><span id="resultTag">READY / 01</span></div>
                <div class="visual"><div class="visual-shape visual-square" id="visualShape"></div></div>
                <div class="metrics" id="metrics"></div>
                <div class="formula" id="formula"></div>
            </section>
        </main>
    </div>
    <script>
        // Fungsi ini menghitung luas dan keliling persegi dari satu parameter sisi.
        function hitungPersegi(sisi) { return { luas: sisi * sisi, keliling: 4 * sisi }; }

        // Fungsi ini menghitung luas dan keliling persegi panjang dari panjang dan lebar.
        function hitungPersegiPanjang(panjang, lebar) { return { luas: panjang * lebar, keliling: 2 * (panjang + lebar) }; }

        // Fungsi ini menghitung luas segitiga dari alas dan tinggi menggunakan setengah hasil kali.
        function hitungSegitiga(alas, tinggi) { return { luas: 0.5 * alas * tinggi }; }

        // Fungsi ini menghitung volume dan luas permukaan balok dari tiga ukuran ruang.
        function hitungBalok(panjang, lebar, tinggi) { return { volume: panjang * lebar * tinggi, luasPermukaan: 2 * (panjang * lebar + panjang * tinggi + lebar * tinggi) }; }

        const konfigurasi = {
            persegi: { nama: 'Persegi', bentuk: 'visual-square', fields: [['sisi', 'Sisi']], hitung: nilai => hitungPersegi(nilai.sisi), hasil: [['luas', 'Luas'], ['keliling', 'Keliling']], rumus: 'luas = sisi × sisi  |  keliling = 4 × sisi' },
            persegiPanjang: { nama: 'Persegi panjang', bentuk: 'visual-rectangle', fields: [['panjang', 'Panjang'], ['lebar', 'Lebar']], hitung: nilai => hitungPersegiPanjang(nilai.panjang, nilai.lebar), hasil: [['luas', 'Luas'], ['keliling', 'Keliling']], rumus: 'luas = panjang × lebar  |  keliling = 2 × (p + l)' },
            segitiga: { nama: 'Segitiga', bentuk: 'visual-triangle', fields: [['alas', 'Alas'], ['tinggi', 'Tinggi']], hitung: nilai => hitungSegitiga(nilai.alas, nilai.tinggi), hasil: [['luas', 'Luas']], rumus: 'luas = ½ × alas × tinggi' },
            balok: { nama: 'Balok', bentuk: 'visual-box', fields: [['panjang', 'Panjang'], ['lebar', 'Lebar'], ['tinggi', 'Tinggi']], hitung: nilai => hitungBalok(nilai.panjang, nilai.lebar, nilai.tinggi), hasil: [['volume', 'Volume'], ['luasPermukaan', 'Luas permukaan']], rumus: 'volume = p × l × t  |  LP = 2 × (pl + pt + lt)' }
        };

        let bentukAktif = 'persegi';

        // Fungsi ini membangun input sesuai jenis bentuk yang sedang dipilih.
        function tampilkanInput() {
            const data = konfigurasi[bentukAktif];
            document.getElementById('fields').innerHTML = data.fields.map(([id, label]) => `<label for="${id}">${label}<span class="unit">masukkan nilai</span><input id="${id}" type="number" min="0.01" step="any" value="${id === 'sisi' ? 8 : id === 'panjang' ? 12 : id === 'lebar' ? 6 : id === 'alas' ? 10 : 4}" required></label>`).join('');
            document.getElementById('resultTitle').textContent = data.nama;
            document.getElementById('visualShape').className = `visual-shape ${data.bentuk}`;
            hitungDanTampilkan();
        }

        // Fungsi ini membaca argumen dari input, menjalankan fungsi matematika, lalu menampilkan hasilnya.
        function hitungDanTampilkan() {
            const data = konfigurasi[bentukAktif];
            const nilai = Object.fromEntries(data.fields.map(([id]) => [id, Number(document.getElementById(id).value)]));
            if (Object.values(nilai).some(angka => !Number.isFinite(angka) || angka <= 0)) return;
            const hasil = data.hitung(nilai);
            document.getElementById('metrics').innerHTML = data.hasil.map(([id, label]) => `<div class="metric"><small>${label.toUpperCase()}</small><strong>${hasil[id].toLocaleString('id-ID', { maximumFractionDigits: 2 })}</strong></div>`).join('');
            document.getElementById('formula').textContent = data.rumus;
            document.getElementById('resultTag').textContent = `CALCULATED / ${Object.keys(hasil).length}`;
        }

        // Fungsi ini mengganti bentuk aktif saat pengguna menekan salah satu tombol pilihan.
        function pilihBentuk(event) {
            const tombol = event.target.closest('[data-shape]');
            if (!tombol) return;
            bentukAktif = tombol.dataset.shape;
            document.querySelectorAll('.shape-button').forEach(item => item.classList.toggle('active', item === tombol));
            tampilkanInput();
        }

        document.getElementById('shapePicker').addEventListener('click', pilihBentuk);
        document.getElementById('calculateButton').addEventListener('click', hitungDanTampilkan);
        tampilkanInput();
    </script>
</body>
</html>
